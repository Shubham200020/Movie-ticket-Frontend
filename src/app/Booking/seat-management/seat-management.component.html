<div class="seat-management-container glass">
  <h2>💺 Seat Management</h2>
  
  <div class="selection-grid">
    <div class="form-group">
      <label>Select Theater</label>
      <select [(ngModel)]="selectedTheaterId" (change)="onTheaterChange()">
        <option [ngValue]="null">Choose Theater</option>
        <option *ngFor="let t of theaters" [value]="t.id">{{ t.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label>Select Screen</label>
      <select [(ngModel)]="selectedScreenId" (change)="onScreenChange()" [disabled]="!selectedTheaterId">
        <option [ngValue]="null">Choose Screen</option>
        <option *ngFor="let s of screens" [value]="s.id">{{ s.name }}</option>
      </select>
    </div>
  </div>

  <div class="config-section" *ngIf="selectedScreenId">
    <div class="header-with-action">
      <h3>Generate Row</h3>
      <button class="btn-delete-all" (click)="deleteAllSeats()" *ngIf="existingSeats.length > 0">Clear Screen</button>
    </div>
    
    <div class="config-grid">
      <div class="form-group">
        <label>Row Letter (A, B...)</label>
        <input type="text" [(ngModel)]="rowLetter" maxlength="1" placeholder="A">
      </div>
      <div class="form-group">
        <label>Start Number</label>
        <input type="number" [(ngModel)]="startNumber" min="1">
      </div>
      <div class="form-group">
        <label>End Number</label>
        <input type="number" [(ngModel)]="endNumber" min="1">
      </div>
      <div class="form-group">
        <label>Seat Type</label>
        <select [(ngModel)]="seatType">
          <option value="Silver">Silver</option>
          <option value="Gold">Gold</option>
          <option value="Platinum">Platinum</option>
        </select>
      </div>
    </div>
    
    <div class="actions">
      <button class="btn-generate" (click)="generateSeats()">Add Row</button>
    </div>
  </div>

  <!-- Preview Section -->
  <div class="preview-section" *ngIf="selectedScreenId">
    <h3>Current Layout ({{ existingSeats.length }} seats)</h3>
    <div class="loading-spinner" *ngIf="isLoading">Loading...</div>
    
    <div class="seat-grid" *ngIf="!isLoading">
      <div class="seat-preview" *ngFor="let seat of existingSeats" [ngClass]="(seat.seatType || '').toLowerCase()">
        {{ seat.row }}{{ seat.number }}
      </div>
    </div>
    
    <div class="no-seats" *ngIf="!isLoading && existingSeats.length === 0">
      No seats defined for this screen yet.
    </div>
  </div>
</div>
