<div class="login-wrapper">
  
  <div class="login-card glass">
    <div class="brand-logo" routerLink="/" style="cursor: pointer;">
      🎬 <span class="brand">MovieZone</span>
    </div>

    <h2 class="welcome-text">Welcome Back</h2>
    <p class="subtitle">Please login to your account</p>

    <!-- 🔘 Role Toggle -->
    <div class="role-toggle">
      <button 
        type="button"
        [class.active]="role === 'user'"
        (click)="setRole('user')">
        User
      </button>

      <button 
        type="button"
        [class.active]="role === 'admin'"
        (click)="setRole('admin')">
        Admin
      </button>
    </div>

    <!-- 🧾 Form -->
    <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="icon">✉️</i>
          <input 
            type="email" 
            name="email" 
            [(ngModel)]="user.email" 
            placeholder="Enter your email"
            required
            pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="icon">🔒</i>
          <input 
            type="password" 
            name="password" 
            [(ngModel)]="user.password" 
            placeholder="Enter your password"
            required
            minlength="6"
          />
        </div>
      </div>

      <button class="login-btn" type="submit" [disabled]="loginForm.invalid">
        {{ role === 'admin' ? 'Login as Admin' : 'Sign In' }}
      </button>

    </form>

    <!-- 🔗 Register -->
    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">Create one now</a>
    </p>

  </div>
</div>
