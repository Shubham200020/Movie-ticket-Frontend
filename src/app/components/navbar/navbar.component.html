<nav class="navbar glass-navbar">
  <div class="logo" routerLink="/" style="cursor: pointer;">
    🎬 <span class="brand">MovieZone</span>
  </div>

  <div class="location-container" (click)="toggleLocationDropdown()">
    <div class="location-badge">
      <i class="fas fa-map-marker-alt"></i> {{ currentCity }}
      <i class="fas fa-chevron-down dropdown-arrow"></i>
    </div>
    <div class="location-dropdown" *ngIf="showLocationDropdown">
      <div class="dropdown-header">Select City</div>
      <div class="dropdown-item" *ngFor="let loc of availableLocations" (click)="selectLocation(loc); $event.stopPropagation()">
        {{ loc.city }}
      </div>
      <div class="dropdown-item use-gps" (click)="detectLocation(); $event.stopPropagation()">
        <i class="fas fa-crosshairs"></i> Use Current Location
      </div>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" placeholder="Search movies, theatres..." />
  </div>

  <div class="menu">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Movies</a>
    <a routerLink="/theatres" routerLinkActive="active">Theatres</a>
    <a routerLink="/dashboard" routerLinkActive="active" *ngIf="isAdmin">Dashboard</a>
    
    <div class="nav-actions">
      <a routerLink="/login" class="btn-login" *ngIf="!isLoggedIn">Login</a>
      <a (click)="logout()" class="btn-logout" *ngIf="isLoggedIn">Logout</a>
      <a routerLink="/profile" class="profile-link" routerLinkActive="active" *ngIf="isLoggedIn" title="My Profile">
        <div class="nav-avatar">{{ (user?.name ? user.name.charAt(0) : 'U') | uppercase }}</div>
      </a>
    </div>
  </div>
</nav>
